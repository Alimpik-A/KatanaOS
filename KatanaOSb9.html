const fSw=ms=>{const t=Math.floor(ms);const m=Math.floor(t/60000);const s=Math.floor(t/1000)%60;const c=Math.floor(t/10)%100;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`;};
const uSw=()=>{sD.textContent=fSw(sE+(sR?performance.now()-sS:0));if(sR)sRAF=requestAnimationFrame(uSw);};
w.body.querySelector('#sw-start').onclick=e=>{if(sR){sE+=performance.now()-sS;sR=false;e.target.textContent='Старт';cancelAnimationFrame(sRAF);}else{sS=performance.now();sR=true;e.target.textContent='Стоп';uSw();}};
w.body.querySelector('#sw-lap').onclick=()=>{if(!sR&&!sE)return;const t=sE+(sR?performance.now()-sS:0);const l=w.body.querySelector('#sw-laps');const dv=el('div');dv.textContent=`Круг ${l.children.length+1}: ${fSw(t)}`;dv.style.padding='4px 0';dv.style.borderBottom='1px solid var(--border)';l.insertBefore(dv,l.firstChild);};
w.body.querySelector('#sw-reset').onclick=()=>{sR=false;sE=0;cancelAnimationFrame(sRAF);sD.textContent='00:00.00';w.body.querySelector('#sw-start').textContent='Старт';w.body.querySelector('#sw-laps').innerHTML='';};
let tR=false,tE=0,tRem=0,tIv=null;const tD=w.body.querySelector('#tm-display');
const fTm=ms=>{const t=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(t/60);const s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;};
const uTm=()=>{tD.textContent=fTm(tRem);};
w.body.querySelector('#tm-start').onclick=e=>{if(tR){tR=false;tRem=tE-performance.now();clearInterval(tIv);e.target.textContent='Старт';}else{let r=tRem;if(r<=0){const m=+w.body.querySelector('#tm-min').value||0;const s=+w.body.querySelector('#tm-sec').value||0;r=(m*60+s)*1000;if(r<=0)return;}tE=performance.now()+r;tR=true;e.target.textContent='Пауза';tIv=setInterval(()=>{tRem=tE-performance.now();if(tRem<=0){tRem=0;tR=false;clearInterval(tIv);uTm();w.body.querySelector('#tm-start').textContent='Старт';try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);o.start();o.stop(ac.currentTime+0.5);}catch(err){}return;}uTm();},100);}};
w.body.querySelector('#tm-reset').onclick=()=>{clearInterval(tIv);tR=false;tRem=0;w.body.querySelector('#tm-start').textContent='Старт';uTm();};
w.cleanup=()=>{cancelAnimationFrame(sRAF);clearInterval(tIv);};
}};

APPS.gputest={name:'GPU Test',iconKey:'gputest',init(w){
w.body.innerHTML=`<div style="height:100%;position:relative;background:#050510;overflow:hidden"><canvas id="gpu-canvas" style="display:block;width:100%;height:100%"></canvas><div id="gpu-info" style="position:absolute;top:10px;left:12px;color:#94a3b8;font-family:'Consolas',monospace;font-size:12px"></div></div>`;
const cv=w.body.querySelector('#gpu-canvas');const ctx=cv.getContext('2d');const info=w.body.querySelector('#gpu-info');
const rs=()=>{const dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};rs();
const R=70,r=28;const pts=[];const mj=70,mn=35;for(let i=0;i<mj;i++){const th=i/mj*Math.PI*2;for(let j=0;j<mn;j++){const ph=j/mn*Math.PI*2;pts.push({x:(R+r*Math.cos(ph))*Math.cos(th),y:(R+r*Math.cos(ph))*Math.sin(th),z:r*Math.sin(ph),hue:(th/(Math.PI*2))*360});}}
const ptcl=[];for(let i=0;i<220;i++)ptcl.push({x:(Math.random()-.5)*520,y:(Math.random()-.5)*520,z:(Math.random()-.5)*520,size:Math.random()*2+0.5,hue:Math.random()*360});
let ax=0,ay=0,frm=0,last=performance.now(),fps=60,run=true;
const rot=(x,y,z,axr,ayr)=>{const cy=Math.cos(axr),sy=Math.sin(axr);const y1=y*cy-z*sy;const z1=y*sy+z*cy;const cx=Math.cos(ayr),sx=Math.sin(ayr);const x1=x*cx+z1*sx;const z2=-x*sx+z1*cx;return{x:x1,y:y1,z:z2};};
const loop=t=>{if(!run||!document.body.contains(cv))return;frm++;const dt=t-last;last=t;if(dt>0)fps=fps*0.9+(1000/dt)*0.1;ax+=0.009;ay+=0.013;const CW=cv.clientWidth,CH=cv.clientHeight;ctx.fillStyle='rgba(5,5,16,0.25)';ctx.fillRect(0,0,CW,CH);const dist=260;const pj=[];for(const p of pts){const rr=rot(p.x,p.y,p.z,ax,ay);const sc=300/(dist+rr.z);if(sc<=0)continue;pj.push({x:CW/2+rr.x*sc,y:CH/2+rr.y*sc,z:rr.z,sc,hue:p.hue});}pj.sort((a,b)=>b.z-a.z);ctx.globalCompositeOperation='lighter';for(const p of pj){const sz=Math.max(1,3*p.sc*0.9);const al=Math.min(1,Math.max(0.12,(p.z+150)/300));ctx.fillStyle=`hsla(${p.hue},95%,62%,${al})`;ctx.beginPath();ctx.arc(p.x,p.y,sz,0,7);ctx.fill();}for(const p of ptcl){const rr=rot(p.x,p.y,p.z,-ax*0.4,-ay*0.4);const sc=250/(dist+rr.z);if(sc<=0)continue;const px=CW/2+rr.x*sc,py=CH/2+rr.y*sc;const sz=Math.max(0.5,p.size*sc*0.6);const al=Math.min(1,Math.max(0.1,(rr.z+260)/520));ctx.fillStyle=`hsla(${p.hue},80%,65%,${al})`;ctx.beginPath();ctx.arc(px,py,sz,0,7);ctx.fill();}ctx.globalCompositeOperation='source-over';if(info)info.textContent=`FPS: ${fps.toFixed(0)} · Points: ${pj.length}`;w._r=requestAnimationFrame(loop);};
w._r=requestAnimationFrame(loop);const or=()=>rs();window.addEventListener('resize',or);w.cleanup=()=>{run=false;cancelAnimationFrame(w._r);window.removeEventListener('resize',or);};
}};

APPS.ide={name:'Code Studio',iconKey:'ide',init(w){
const DEF=`<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><title>App</title>\n<style>body{font-family:sans-serif;background:linear-gradient(135deg,#1e3a8a,#6d28d9);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:20px}h1{font-size:48px;margin:0}</style></head>\n<body><h1>Привет, KatanaOS!</h1></body>\n</html>`;
w.body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div class="app-btnbar"><button class="btn" id="ide-new">📄 Новый</button><button class="btn" id="ide-open">📂 Открыть</button><button class="btn primary" id="ide-save">💾 Сохранить</button><button class="btn" id="ide-run">▶ Запустить</button><span style="flex:1"></span><span style="font-size:11px;color:var(--dim)" id="ide-status">Новый</span></div><textarea id="ide-code" spellcheck="false" style="flex:1;border:none;border-radius:0;background:#0d1117;color:#c9d1d9;font-family:'Consolas',monospace;font-size:13px;padding:14px;resize:none;width:100%;tab-size:2;line-height:1.5"></textarea></div>`;
const code=w.body.querySelector('#ide-code');const st=w.body.querySelector('#ide-status');let cp=null,dt=false;
code.value=(w.opts&&w.opts.code!==undefined)?w.opts.code:DEF;
if(w.opts&&w.opts.filePath){cp=[...w.opts.filePath];st.textContent=cp[cp.length-1];}
const sSt=(t,d)=>{st.textContent=t+(d?' *':'');st.style.color=d?'#fbbf24':'var(--dim)';};
const cN=()=>cp?cp[cp.length-1]:'Новый';
code.oninput=()=>{dt=true;sSt(cN(),true);};
code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=code.selectionStart,en=code.selectionEnd;code.value=code.value.slice(0,s)+'  '+code.value.slice(en);code.selectionStart=code.selectionEnd=s+2;dt=true;sSt(cN(),true);}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();sf();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();rc();}});
const sf=()=>{let n;if(cp){n=cp[cp.length-1];}else{n=prompt('Имя:','app_'+Date.now()+'.html');if(!n)return;if(!/\.[a-z0-9]+$/i.test(n))n+='.html';}if(!fsGet(['Документы']))fsCreate([],'Документы','folder');if(cp&&fsGet(cp)){fsGet(cp).content=code.value;saveFS();sSt(n,false);dt=false;}else{const fn=fsCreate(['Документы'],n,'file',code.value);if(fn===false){alert('Ошибка');return;}cp=['Документы',fn];sSt(fn,false);dt=false;w.title='Code Studio — '+fn;const ts=w.node.querySelector('.window-title span');if(ts)ts.textContent=w.title;}};
const rc=()=>{openApp('htmlrun',{noReuse:true,title:cp?cp[cp.length-1]:'Программа',htmlContent:code.value});};
w.body.querySelector('#ide-new').onclick=()=>{if(dt&&!confirm('Не сохранено?'))return;code.value=DEF;cp=null;dt=false;sSt('Новый',false);};
w.body.querySelector('#ide-open').onclick=()=>{const files=fsGet(['Документы']);if(!files||!files.children){alert('Нет файлов');return;}const names=Object.keys(files.children).filter(n=>files.children[n].type==='file'&&/\.(html?|js|css|json|txt)$/i.test(n));if(!names.length){alert('Нет файлов');return;}const n=prompt('Имя:\n'+names.join('\n'));if(!n)return;const f=files.children[n];if(!f||f.type!=='file'){alert('Не найден');return;}code.value=f.content||'';cp=['Документы',n];dt=false;sSt(n,false);w.title='Code Studio — '+n;const ts=w.node.querySelector('.window-title span');if(ts)ts.textContent=w.title;};
w.body.querySelector('#ide-save').onclick=sf;w.body.querySelector('#ide-run').onclick=rc;
}};
